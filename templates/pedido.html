<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>DALMA FRANCO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="fondo">

    <!-- DAL FRANCO flotando a los costados -->
    <div class="dal-izq">DALMA FRANCO</div>
    <div class="dal-der">DALMA FRANCO</div>

    <!-- Barra superior -->
    <div class="top-bar">
        <a href="/logout" class="btn-salir">✖️ Salir</a>
        <div class="fecha-top">{{ fecha }}</div>
    </div>

    <div class="contenedor">

        <h1>DF SYSTEM ✨</h1>

        <form action="/generar" method="POST">

            <input type="text" name="cliente" placeholder="Cliente" required>
            <input type="text" name="razon" placeholder="Razón Social (Opcional)">
            <input type="text" name="zona" placeholder="Zona">
<!-- Selector de vendedor -->
            <select name="vendedor" required>
                <option value="" disabled selected>👤 Seleccioná el vendedor</option>
                <option value="Walter">Walter</option>
                <option value="ENZO">ENZO</option>
            </select>

            <!-- Fecha de entrega visible y clara -->
            <label class="label-fecha">📅 Fecha de Entrega</label>
            <input type="date" name="fecha_entrega" required>

            <textarea name="nota" placeholder="Nota adicional..." rows="3"></textarea>

            <h2>Productos</h2>

            <div id="productos">
                <div class="fila">
                    <input list="listaProductos" name="producto[]" placeholder="Buscar producto" required>
                    <input type="text" name="cantidad[]" placeholder="Cantidad" required>
                    <button type="button" class="btn-borrar" onclick="borrarFila(this)">✖️</button>
                </div>
            </div>

            <datalist id="listaProductos">
                {% for producto in productos %}
                    <option value="{{ producto.codigo }} - {{ producto.nombre }}">
                {% endfor %}
            </datalist>

            <button type="button" onclick="agregarProducto()">+ Agregar Producto</button>
            <button type="submit">📄 Generar Pedido</button>

        </form>

    </div>

    <script>
        function agregarProducto() {
            let contenedor = document.getElementById("productos");
            let fila = document.createElement("div");
            fila.className = "fila";
            fila.innerHTML = `
                <input list="listaProductos" name="producto[]" placeholder="Buscar producto" required>
                <input type="text" name="cantidad[]" placeholder="Cantidad" required>
                <button type="button" class="btn-borrar" onclick="borrarFila(this)">✖️</button>
            `;
            contenedor.appendChild(fila);
        }

        function borrarFila(btn) {
            let contenedor = document.getElementById("productos");
            // No borrar si es la única fila
            if (contenedor.children.length > 1) {
                btn.parentElement.remove();
            }
        }
    </script>

</body>
</html>
