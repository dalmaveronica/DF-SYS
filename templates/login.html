<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DF System — Ingresar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="fondo-login">

    <div class="login-cabecera">
        <h1 class="login-titulo">DF System</h1>
        <p class="login-sub">Sistema de gestión de pedidos</p>
    </div>

    <form method="POST" class="login-card">

        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="tu usuario"
               autocomplete="username" autocapitalize="none" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••"
               autocomplete="current-password" required>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <button type="submit" class="login-btn">INGRESAR →</button>

    </form>

</body>
</html>
